name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build, tests, coverage gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Integration tests start Postgres through Testcontainers; Docker is available on the runner.
      - name: Verify (unit, property, integration, API tests; JaCoCo gate at 80% line)
        working-directory: backend
        run: mvn -B verify
      - name: Coverage summary
        if: always()
        working-directory: backend
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET, os
          p = 'target/site/jacoco/jacoco.xml'
          if os.path.exists(p):
              r = ET.parse(p).getroot()
              for c in r.findall('counter'):
                  if c.get('type') in ('LINE', 'BRANCH'):
                      m, cv = int(c.get('missed')), int(c.get('covered'))
                      print(f"{c.get('type')}: {cv/(m+cv):.1%} ({cv}/{m+cv})")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: backend/target/site/jacoco

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run build -- --configuration production

  containers:
    name: Container images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: billing-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: billing-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
